# Files excluded from mutation testing; each one is listed with its reason in COVERAGE_EXCLUSIONS.md.
exclude_globs = ["src-tauri/src/main.rs", "crates/hive/src/macos.rs"]
# Build with `[profile.mutants]` (Cargo.toml: no debug info) and test with nextest, which fails
# fast by default: no test starts after the first failure, the one a mutant needs to be caught.
# The tests already running finish, so `common::Env`'s drop still stops their daemons. Nextest
# runs no doctests; the workspace has none, so no mutant can be caught only by one.
profile = "mutants"
test_tool = "nextest"
