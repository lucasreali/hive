# What every Rust job of ci.yml needs before cargo runs.
name: setup-rust
description: Rust toolchain and cargo tools, Tauri's Linux libraries, fish 4 and the built frontend.
inputs:
  tools:
    description: The cargo tools this job runs, comma-separated for taiki-e/install-action (none by default).
    default: ""
  cache-key:
    description: Extra key for Swatinem/rust-cache (jobs that build another profile).
    default: ""
  cache-save:
    description: Whether this job saves the cache ("true"/"false").
    default: "true"
runs:
  using: composite
  steps:
    # Tauri (src-tauri) links WebKitGTK; the integration tests' terminals run fish 4, as on
    # the human's WSL (Ubuntu's own fish is 3.x).
    - shell: bash
      run: |
        sudo add-apt-repository -y ppa:fish-shell/release-4
        sudo apt-get update
        sudo apt-get install -y fish libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: rustfmt, clippy, llvm-tools-preview
    - if: inputs.tools != ''
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: ${{ inputs.tools }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.cache-save }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    # `tauri::generate_context!` needs the built frontend (`dist`).
    - shell: bash
      run: bun install --frozen-lockfile && bun run build
