# Every quality gate of CLAUDE.md, run on GitHub instead of the human's WSL machine (TODO
# 5.11): heavy local builds have taken the WSL VM down. A task merges into `main` only when
# this workflow (and macos.yml) is green on its branch tip. scripts/gates.sh is the optional
# local equivalent of the Rust jobs.
name: ci

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --locked
      - run: cargo deny check
      - run: cargo machete

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      # Exclusions: COVERAGE_EXCLUSIONS.md (same regex as scripts/gates.sh).
      - run: cargo llvm-cov --workspace --show-missing-lines --fail-under-lines 100 --ignore-filename-regex 'src-tauri/src/main\.rs|crates/hive/src/macos\.rs'

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      # A task branch: the mutants of its own diff since it left `main` (merge base, so
      # commits that landed on `main` meanwhile are not counted). On `main` itself nothing
      # runs: every commit arrives by fast-forward from a task branch whose run already
      # tested its mutants. Exit code 2 (missed) or 3 (timeout) fails the job.
      - name: cargo mutants --in-diff
        if: github.ref != 'refs/heads/main'
        run: |
          git diff "$(git merge-base origin/main HEAD)" -- '*.rs' > "$RUNNER_TEMP/diff.patch"
          if [ ! -s "$RUNNER_TEMP/diff.patch" ]; then echo "no Rust changes"; exit 0; fi
          cargo mutants --gitignore true -j 2 --timeout 120 --in-diff "$RUNNER_TEMP/diff.patch"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-out
          path: mutants.out
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bunx playwright install --with-deps chromium
      # ponytail: continue-on-error until 5.9 lands (the specs fail on main); remove it then.
      - id: e2e
        run: bun run e2e
        continue-on-error: true
      - if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: target/e2e
          retention-days: 7
