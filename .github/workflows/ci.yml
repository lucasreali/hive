# Every quality gate of CLAUDE.md, run on GitHub instead of the human's WSL machine (TODO
# 5.11): heavy local builds have taken the WSL VM down. A task merges into `main` only when
# this workflow (and macos.yml) is green on its branch tip. scripts/gates.sh is the optional
# local equivalent of the Rust jobs.
name: ci

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:
    inputs:
      mutants-base:
        description: Diff base for the mutants (default the merge base with main)
        type: string
        default: ""

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --locked
      - run: cargo deny check
      - run: cargo machete
      - run: python3 .claude/hooks/test_guard.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      # Exclusions: COVERAGE_EXCLUSIONS.md (same regex as scripts/gates.sh).
      - run: cargo llvm-cov --workspace --show-missing-lines --fail-under-lines 100 --ignore-filename-regex 'src-tauri/src/main\.rs|crates/hive/src/macos\.rs'

  # The diff's mutants, sharded by their number (mutants.yml, TODO 7.1). `mutants-base` re-runs
  # them for another range (e.g. to measure a change to the mutants setup).
  mutants:
    uses: ./.github/workflows/mutants.yml
    with:
      in-diff: true
      base: ${{ inputs.mutants-base }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bunx playwright install --with-deps chromium
      # The load spec renders WebGL through ANGLE on the system GL (Mesa; llvmpipe here, the
      # runner has no GPU). Without Mesa's EGL and a display Chromium falls back to
      # SwiftShader, which the spec rejects as unrepresentative.
      - run: sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri xvfb
      - run: xvfb-run -a bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: target/e2e
          retention-days: 7

  # Whether this push can change what compiles on Windows (TODO 9.4): the branch's diff since it
  # left `main` (merge base with origin/main, as mutants.yml), or always on `main`. A job skipped
  # by its `if` still leaves the run green, so `scripts/ci.sh watch` waits for nothing more.
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # hive-protocol is compiled into the app; ci.yml itself, so a change to the job runs it.
      - id: diff
        run: |
          windows=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            grep -qE '^(src-tauri/|crates/hive-protocol/|Cargo\.(toml|lock)$|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)' <<< "$files" ||
              windows=false
          fi
          echo "windows=$windows" | tee -a "$GITHUB_OUTPUT"

  # The app's `#[cfg(windows)]` code (main.rs `disable_browser_keys`, parts of lib.rs), which the
  # Linux jobs never compile: without this job a Windows break shows first in release.yml.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # `tauri::generate_context!` needs the built frontend (`dist`).
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy -p hive-app --all-targets --locked -- -D warnings
