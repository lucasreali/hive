# Every quality gate of CLAUDE.md on Linux. GitHub Actions is the authority (TODO 5.11, D17.6):
# a task merges into `main` only when this workflow and macos.yml are green on its branch tip,
# and Linux-only code is verified only here. scripts/gates.sh is the local equivalent of the Rust
# jobs on the human's Mac.
name: ci

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:
    inputs:
      mutants-base:
        description: Diff base for the mutants (default the merge base with main)
        type: string
        default: ""

# The checks only read the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny,cargo-machete
      - run: cargo fmt --all --check
      # `--locked` here: clippy builds every target, so it stands for `cargo check --locked`.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `cargo test --workspace` runs instrumented in `coverage`, all but the doctests (llvm-cov
      # needs nightly for them), which run here.
      - run: cargo test --workspace --doc --locked
      - run: cargo deny check
      - run: cargo machete
      - run: python3 .claude/hooks/test_guard.py
      # release.sh and the gates' memory watchdog (TODO 17.2); macos.yml runs it on macOS.
      - run: scripts/test-scripts.sh

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-llvm-cov
      # Exclusions: COVERAGE_EXCLUSIONS.md (same regex as scripts/gates.sh).
      - run: cargo llvm-cov --workspace --locked --show-missing-lines --fail-under-lines 100 --ignore-filename-regex 'src-tauri/src/main\.rs|crates/hive/src/macos\.rs|crates/hive/src/windows[^/]*\.rs'

  # The diff's mutants, sharded by their number (mutants.yml, TODO 7.1). `mutants-base` re-runs
  # them for another range (e.g. to measure a change to the mutants setup).
  mutants:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/mutants.yml
    with:
      in-diff: true
      base: ${{ inputs.mutants-base }}

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Pinned: a newer bun counts comment-only lines as uncovered.
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      # WebKit (TODO 17.3): the engine of macOS' WKWebView, where Hive runs on a Mac.
      - run: bunx playwright install --with-deps chromium webkit
      # The load spec renders WebGL through ANGLE on the system GL (Mesa; llvmpipe here, the
      # runner has no GPU). Without Mesa's EGL and a display Chromium falls back to
      # SwiftShader, and the spec fails: its renderer must not be SwiftShader.
      - run: sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri xvfb
      - run: xvfb-run -a bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: target/e2e
          retention-days: 7

  # What this push can change, from the branch's diff since it left `main` (merge base with
  # origin/main, as mutants.yml); everything on `main` and on a manual run. `code`: anything but
  # docs (Markdown, docs/, the agents' skills), so a docs-only push runs no gate; except
  # docs/architecture.md, whose message catalog a protocol test reads. `windows` (TODO 9.4): what
  # compiles on Windows; hive-protocol is compiled into the app; ci.yml itself, so a change to
  # the job runs it. A job skipped by its `if` still leaves the run green, so
  # `scripts/ci.sh watch` waits for nothing more.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=true windows=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            grep -qvE '\.md$|^docs/|^\.claude/(skills|agents)/' <<< "$files" ||
              grep -qx 'docs/architecture\.md' <<< "$files" ||
              code=false
            grep -qE '^(src-tauri/|crates/hive-protocol/|Cargo\.(toml|lock)$|package\.json$|bun\.lock$|\.github/workflows/ci\.yml$)' <<< "$files" ||
              windows=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "windows=$windows" | tee -a "$GITHUB_OUTPUT"

  # The Linux `hive` the Windows installer carries, as release.yml's `linux` job builds it.
  linux-hive:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p hive
      - uses: actions/upload-artifact@v6
        with:
          name: hive-linux
          path: target/release/hive
          if-no-files-found: error
          retention-days: 1

  # The app's `#[cfg(windows)]` code (main.rs `disable_browser_keys`, parts of lib.rs), which the
  # Linux jobs never compile: without this job a Windows break shows first in release.yml. Then
  # the installer as release.yml builds it, with the Linux `hive` and `hive.exe` (12.5.4) inside.
  windows:
    needs: [changes, linux-hive]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Pinned: a newer bun counts comment-only lines as uncovered.
        with:
          bun-version-file: .bun-version
      # `tauri::generate_context!` needs the built frontend (`dist`).
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy -p hive-app --all-targets --locked -- -D warnings
      - uses: actions/download-artifact@v7
        with:
          name: hive-linux
          path: src-tauri/resources
      # No updater artifacts, so no signing key: that stays in release.yml's `release` environment
      # (#29). Static CRT as in release.yml.
      - run: |
          cargo build --release --locked -p hive
          cp target/release/hive.exe src-tauri/resources/hive.exe
          bun tauri build --config src-tauri/tauri.release.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - uses: actions/upload-artifact@v6
        with:
          name: hive-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
