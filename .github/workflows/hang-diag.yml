# TEMPORARY: finds the hive lib test that hangs now and then on macos-14 (macos.yml's mutants).
name: hang-diag

on:
  push:
    branches: [task/17-macos-hang]

permissions:
  contents: read

concurrency:
  group: hang-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      - run: brew install fish
      - run: cargo test -p hive --lib --no-run
      # Two loops at once, as `cargo mutants -j 2`: each `cargo test` run is watched; past
      # 100 s its test binary is sampled (thread names are the tests' names), then killed.
      - name: loop cargo test
        run: |
          cat > watch.sh <<'EOF'
          #!/bin/bash
          # watch.sh <label> <command...>: run, sample the hung process tree past 100 s.
          label=$1; shift
          "$@" > "out-$label.log" 2>&1 &
          pid=$!
          start=$(date +%s)
          sampled=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 2
            now=$(date +%s)
            if [ $((now - start)) -ge 100 ] && [ $sampled = 0 ]; then
              sampled=1
              echo "::warning::HANG in $label after $((now - start)) s"
              echo "----- output so far ($label)"
              grep -vE '\.\.\. ok$' "out-$label.log" | tail -60
              echo "----- processes"
              ps -axo pid,ppid,pgid,etime,stat,command | grep -vE '^ *[0-9]+ +[0-9]+ +[0-9]+ +[0-9:-]+ +[A-Za-z+<]+ +(/System|/usr/libexec|/usr/sbin|/Library|/Applications)' | tail -80
              for t in $(pgrep -f 'target/debug/deps/hive-'); do
                echo "----- sample $t: $(ps -o etime=,command= -p "$t")"
                sudo sample "$t" 3 -mayDie 2>&1 | sed -n '/^Call graph:/,/^Total number in stack/p' | head -400
                echo "----- lsof $t"
                sudo lsof -p "$t" 2>&1 | grep -vE ' (REG|DIR|CHR) ' | head -60
              done
              for t in $(pgrep -P "$pid"); do
                pkill -KILL -P "$t"
                kill -KILL "$t"
              done
            fi
          done
          wait "$pid"; code=$?
          echo "$label: exit $code in $(( $(date +%s) - start )) s; $(grep -E '^test result' "out-$label.log" | tail -1)"
          grep -E 'FAILED|panicked|running for over' "out-$label.log" | head -20
          exit 0
          EOF
          chmod +x watch.sh
          loop() { for i in $(seq 1 30); do ./watch.sh "$1-$i" cargo test -p hive --lib; done; }
          loop a & loop b & loop c & wait
      - name: loop nextest
        if: always()
        run: |
          mkdir -p .config
          cat > .config/nextest.toml <<'EOF'
          [profile.default]
          slow-timeout = { period = "30s", terminate-after = 4 }
          fail-fast = false
          EOF
          for i in $(seq 1 10); do
            ./watch.sh "n-$i" cargo nextest run -p hive --lib --cargo-profile mutants --no-fail-fast
            grep -E 'SLOW|TIMEOUT|LEAK|FAIL' "out-n-$i.log" | head -20 || true
          done

  mutants:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-mutants
      - run: brew install fish
      # As macos.yml, twice, with a sampler of any test binary older than 90 s.
      - name: mutants
        run: |
          (
            seen=" "
            while true; do
              sleep 5
              for t in $(pgrep -f '/deps/hive-'); do
                e=$(ps -o etime= -p "$t" | tr -d ' ')
                case "$e" in *:*:*|*-*) old=1 ;; *) m=${e%%:*}; s=${e##*:}; old=$(( 10#$m * 60 + 10#$s >= 90 )) ;; esac
                case "$seen" in *" $t "*) continue ;; esac
                if [ "$old" = 1 ]; then
                  seen="$seen$t "
                  echo "::warning::SLOW test binary $t ($e): $(ps -o command= -p "$t")"
                  ps -axo pid,ppid,pgid,etime,stat,command | grep -E 'hive|claude|node|fish|sleep|sh ' | grep -v grep | head -60
                  sudo sample "$t" 3 -mayDie 2>&1 | sed -n '/^Call graph:/,/^Total number in stack/p' | head -400
                  sudo lsof -p "$t" 2>&1 | grep -vE ' (REG|DIR|CHR) ' | head -60
                fi
              done
            done
          ) &
          for i in 1 2; do
            cargo mutants --no-config -f crates/hive/src/macos.rs -j 2 --timeout 120 || true
            grep -rlE 'running for over' mutants.out/log || true
            for f in $(grep -rlE 'running for over|TIMEOUT' mutants.out/log); do echo "== $f"; grep -E 'running for over|FAILED|test result' "$f"; done
            cp -r mutants.out "mutants.out.$i"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-out
          path: mutants.out.*
          retention-days: 3
