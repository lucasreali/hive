# Temporary: compiles src-tauri/icons/AppIcon.icon into Assets.car with Xcode 26's actool (no
# Xcode on the dev Mac); removed once the result is committed.
name: icon-tmp
on:
  push:
    branches: [task/app-icon]
    paths: [.github/workflows/icon-tmp.yml]
jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: |
          xcrun actool --version
          mkdir out
          xcrun actool src-tauri/icons/AppIcon.icon --compile out --output-format human-readable-text \
            --notices --warnings --errors --output-partial-info-plist out/partial.plist \
            --app-icon AppIcon --include-all-app-icons --enable-on-demand-resources NO \
            --development-region en --target-device mac --minimum-deployment-target 12.0 \
            --platform macosx
          ls -la out
          assetutil --info out/Assets.car | head -80
      - uses: actions/upload-artifact@v6
        with:
          name: assets-car
          path: out/
