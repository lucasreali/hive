# A tag `v*` (made by scripts/release.sh) publishes a GitHub release: the Windows installer
# with the Linux `hive` inside it, the macOS app (.dmg) with the macOS `hive` inside it, their
# updater signatures and `latest.json`, which the app's updater reads (TODO 4.17–4.19, 5.3).
# Windows and macOS build in parallel; only `publish` touches the release, so `latest.json` is
# written once, with every platform, in the shape tauri-action used to produce.
# `workflow_dispatch` is a dry run: everything but the release, printing `latest.json`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner: a glibc this old runs on any recent WSL distribution.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p hive
      - uses: actions/upload-artifact@v6
        with:
          name: hive-linux
          path: target/release/hive
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    env:
      # Static CRT: stock Windows has no VC++ redistributable (as in scripts/win-dev.sh).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v7
        with:
          name: hive-linux
          path: src-tauri/resources
      - run: bun install --frozen-lockfile
      - run: bun tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    # Apple Silicon only (#39).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: |
          cargo build --release --locked -p hive
          mkdir -p src-tauri/resources
          cp target/release/hive src-tauri/resources/hive
      - run: bun install --frozen-lockfile
      - run: bun tauri build --config src-tauri/tauri.release.macos.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The asset names tauri-action gave the updater tarball (`Hive_aarch64.app.tar.gz`).
      - run: |
          mkdir out
          cp target/release/bundle/dmg/*.dmg out/
          cp target/release/bundle/macos/Hive.app.tar.gz out/Hive_aarch64.app.tar.gz
          cp target/release/bundle/macos/Hive.app.tar.gz.sig out/Hive_aarch64.app.tar.gz.sig
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-macos
          path: out/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true
      - name: latest.json
        env:
          # A dry run names the release after the version it would publish.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag=${TAG:-v$version}
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match version $version" >&2; exit 1; }
          base=https://github.com/${{ github.repository }}/releases/download/$tag
          exe=$(cd out && ls *-setup.exe)
          # Separate assignments: `set -e` stops on a missing signature.
          win_sig=$(cat "out/$exe.sig")
          mac_sig=$(cat out/Hive_aarch64.app.tar.gz.sig)
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --arg win_sig "$win_sig" --arg win_url "$base/$exe" \
            --arg mac_sig "$mac_sig" --arg mac_url "$base/Hive_aarch64.app.tar.gz" \
            '{version: $version, notes: "", pub_date: $date, platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "windows-x86_64-nsis": {signature: $win_sig, url: $win_url},
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
                "darwin-aarch64-app": {signature: $mac_sig, url: $mac_url}}}' > out/latest.json
          cat out/latest.json
          ls -l out
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # `gh release create` uploads every file before it publishes the release, so the
      # updater never sees a `latest.json` whose files are missing.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "Hive $TAG" --notes "" out/*
