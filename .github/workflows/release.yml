# A tag `v*` (made by scripts/release.sh) publishes a GitHub release: the Windows installer
# with the Linux `hive` and `hive.exe` (12.5.4) inside it, the macOS app (.dmg) with the macOS `hive` inside it, their
# updater signatures and `latest.json`, which the app's updater reads (TODO 4.17–4.19, 5.3).
# Windows and macOS build in parallel; only `publish` touches the release, so `latest.json` is
# written once, with every platform, in the shape tauri-action used to produce.
# `workflow_dispatch` is a dry run: everything but the release, printing `latest.json`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Releases only from a green CI (TODO 9.4): a successful `ci` run of the tagged commit, or of its
  # parent when the tagged commit is scripts/release.sh's version bump, which no branch tests.
  ci-green:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green() {
            gh run list --workflow ci.yml --commit "$(git rev-parse "$1")" --status success \
              --json url -q '.[0].url // empty'
          }
          url=$(green HEAD)
          if [ -n "$url" ]; then echo "ci is green on the tagged commit: $url"; exit 0; fi
          # The bump: only these files, and every changed line a manifest's `version`.
          files=$(git diff --name-only HEAD^ HEAD)
          lines=$(git diff -U0 HEAD^ HEAD | grep -E '^[-+]' | grep -vE '^(---|\+\+\+) ' || true)
          if grep -qvxE 'package\.json|src-tauri/tauri\.conf\.json|src-tauri/Cargo\.toml|crates/hive/Cargo\.toml|Cargo\.lock' <<< "$files" ||
            grep -qvxE '[-+](  "version": "[0-9]+\.[0-9]+\.[0-9]+",|version = "[0-9]+\.[0-9]+\.[0-9]+")' <<< "$lines"
          then
            echo "no green ci run for $(git rev-parse HEAD); re-run this workflow once ci is green" >&2
            exit 1
          fi
          url=$(green HEAD^)
          if [ -z "$url" ]; then
            echo "the tagged commit only bumps versions, but its parent $(git rev-parse HEAD^) has no green ci run" >&2
            exit 1
          fi
          echo "the tagged commit only bumps versions: accepting its parent's green ci run: $url"

  linux:
    needs: ci-green
    # The oldest supported runner: a glibc this old runs on any recent WSL distribution.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked -p hive
      - uses: actions/upload-artifact@v6
        with:
          name: hive-linux
          path: target/release/hive
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    # The updater signing key (#29) lives only in this environment, open only to `v*` tags.
    environment: release
    env:
      # Static CRT: stock Windows has no VC++ redistributable (as in scripts/win-dev.sh).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@v7
        with:
          name: hive-linux
          path: src-tauri/resources
      # The service on Windows itself (12.5.4), bundled next to the Linux `hive`.
      - run: |
          cargo build --release --locked -p hive
          cp target/release/hive.exe src-tauri/resources/hive.exe
        shell: bash
      - run: bun install --frozen-lockfile
      - run: bun tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    needs: ci-green
    # Apple Silicon only (#39).
    runs-on: macos-14
    environment: release
    # Signing (TODO 17.11, D17.1): ad-hoc, unless the `release` environment holds every Developer
    # ID secret below; then the app and its nested `hive` are signed with that identity under the
    # hardened runtime, and Tauri notarizes and staples the app (App Store Connect API key).
    env:
      CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      API_KEY: ${{ secrets.APPLE_API_KEY }}
      API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # All six secrets, or none: a partial set fails rather than shipping ad-hoc by mistake.
      - id: signing
        run: |
          set=0
          for v in CERTIFICATE CERTIFICATE_PASSWORD DEVELOPER_ID API_ISSUER API_KEY API_KEY_P8; do
            [ -z "${!v}" ] || set=$((set + 1))
          done
          case $set in
            0) echo "developer_id=false" >> "$GITHUB_OUTPUT"; echo "signing ad-hoc (no Developer ID secrets)" ;;
            6) echo "developer_id=true" >> "$GITHUB_OUTPUT"; echo "signing with the Developer ID" ;;
            *) echo "only $set of the 6 Developer ID secrets are set" >&2; exit 1 ;;
          esac
      # The certificate in a keychain of this job only, and the API key in a file (Tauri reads a path).
      - if: steps.signing.outputs.developer_id == 'true'
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: |
          cargo build --release --locked -p hive
          mkdir -p src-tauri/resources
          cp target/release/hive src-tauri/resources/hive
      - run: bun install --frozen-lockfile
      # The nested `hive` with the identity the app gets (notarization needs every binary signed).
      # Tauri notarizes only when the APPLE_API_* variables are set, so the ad-hoc path leaves them out.
      - run: |
          configs=(--config src-tauri/tauri.release.macos.conf.json)
          if [ "${{ steps.signing.outputs.developer_id }}" = true ]; then
            export APPLE_SIGNING_IDENTITY=$DEVELOPER_ID APPLE_API_ISSUER=$API_ISSUER APPLE_API_KEY=$API_KEY
            export APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8
            configs+=(--config "$(jq -cn --arg id "$DEVELOPER_ID" '{bundle: {macOS: {signingIdentity: $id}}}')")
          fi
          scripts/macos-bundle.sh sign-hive src-tauri/resources/hive
          bun tauri build "${configs[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # codesign --verify --deep --strict, the nested `hive`'s signer, entitlements, Info.plist;
      # with the Developer ID also `spctl -a` and the stapled ticket.
      - run: |
          scripts/macos-bundle.sh check target/release/bundle/macos/Hive.app \
            ${{ steps.signing.outputs.developer_id == 'true' && '--developer-id' || '' }}
      - if: always() && steps.signing.outputs.developer_id == 'true'
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/api-key.p8"
      # The asset names tauri-action gave the updater tarball (`Hive_aarch64.app.tar.gz`).
      - run: |
          mkdir out
          cp target/release/bundle/dmg/*.dmg out/
          cp target/release/bundle/macos/Hive.app.tar.gz out/Hive_aarch64.app.tar.gz
          cp target/release/bundle/macos/Hive.app.tar.gz.sig out/Hive_aarch64.app.tar.gz.sig
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-macos
          path: out/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true
      - name: latest.json
        env:
          # A dry run names the release after the version it would publish.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag=${TAG:-v$version}
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match version $version" >&2; exit 1; }
          base=https://github.com/${{ github.repository }}/releases/download/$tag
          exe=$(cd out && ls *-setup.exe)
          # Separate assignments: `set -e` stops on a missing signature.
          win_sig=$(cat "out/$exe.sig")
          mac_sig=$(cat out/Hive_aarch64.app.tar.gz.sig)
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --arg win_sig "$win_sig" --arg win_url "$base/$exe" \
            --arg mac_sig "$mac_sig" --arg mac_url "$base/Hive_aarch64.app.tar.gz" \
            '{version: $version, notes: "", pub_date: $date, platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "windows-x86_64-nsis": {signature: $win_sig, url: $win_url},
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
                "darwin-aarch64-app": {signature: $mac_sig, url: $mac_url}}}' > out/latest.json
          cat out/latest.json
          ls -l out
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # `gh release create` uploads every file before it publishes the release, so the
      # updater never sees a `latest.json` whose files are missing.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "Hive $TAG" --notes "" out/*
