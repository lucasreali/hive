# A tag `v*` (made by scripts/release.sh) publishes a GitHub release: the Windows installer
# with the Linux `hive` and `hive.exe` (12.5.4) inside it, the macOS app (.dmg) with the macOS `hive` inside it, their
# updater signatures and `latest.json`, which the app's updater reads (TODO 4.17–4.19, 5.3).
# Windows and macOS build in parallel; only `publish` touches the release, so `latest.json` is
# written once, with every platform, in the shape tauri-action used to produce.
# `workflow_dispatch` is a dry run: everything but the release, printing `latest.json`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Releases only from a green CI (TODO 9.4): successful `ci` and `macos` runs (D18.1; `windows`
  # is optional, D17.0) of the tagged commit, or of its parent when the tagged commit is
  # scripts/release.sh's version bump, which no branch tests. `scripts/ci.sh green` checks the same.
  ci-green:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # green <rev>: each workflow's green run, or which one has none (and status 1).
          green() {
            local workflow url status=0
            for workflow in ci macos; do
              url=$(gh run list --workflow "$workflow.yml" --commit "$(git rev-parse "$1")" \
                --status success --json url -q '.[0].url // empty')
              if [ -n "$url" ]; then echo "$workflow green: $url"; else echo "$workflow: no green run"; status=1; fi
            done
            return $status
          }
          if green HEAD; then echo "ci and macos are green on the tagged commit"; exit 0; fi
          # The bump: only these files, and every changed line a manifest's `version`.
          files=$(git diff --name-only HEAD^ HEAD)
          lines=$(git diff -U0 HEAD^ HEAD | grep -E '^[-+]' | grep -vE '^(---|\+\+\+) ' || true)
          if grep -qvxE 'package\.json|src-tauri/tauri\.conf\.json|src-tauri/Cargo\.toml|crates/hive/Cargo\.toml|Cargo\.lock' <<< "$files" ||
            grep -qvxE '[-+](  "version": "[0-9]+\.[0-9]+\.[0-9]+",|version = "[0-9]+\.[0-9]+\.[0-9]+")' <<< "$lines"
          then
            echo "$(git rev-parse HEAD) is not green; re-run this workflow once ci and macos are" >&2
            exit 1
          fi
          if ! green HEAD^; then
            echo "the tagged commit only bumps versions, but its parent $(git rev-parse HEAD^) is not green" >&2
            exit 1
          fi
          echo "the tagged commit only bumps versions: accepting its parent's green runs"

  linux:
    needs: ci-green
    # The oldest supported runner: a glibc this old runs on any recent WSL distribution.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked -p hive
      - uses: actions/upload-artifact@v6
        with:
          name: hive-linux
          path: target/release/hive
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    # The updater signing key (#29) lives only in this environment, open only to `v*` tags.
    environment: release
    env:
      # Static CRT: stock Windows has no VC++ redistributable (as in scripts/win-dev.sh).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Pinned: a newer bun counts comment-only lines as uncovered.
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v7
        with:
          name: hive-linux
          path: src-tauri/resources
      # The service on Windows itself (12.5.4), bundled next to the Linux `hive`.
      - run: |
          cargo build --release --locked -p hive
          cp target/release/hive.exe src-tauri/resources/hive.exe
        shell: bash
      - run: bun install --frozen-lockfile
      - run: bun tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    needs: ci-green
    # Apple Silicon only (#39). macos-26 since GitHub retired macos-14 (the human, 2026-11-05).
    runs-on: macos-26
    environment: release
    # Signing (TODO 17.11, 25.5, D17.1): with every Developer ID secret of the `release` environment
    # (README "Releasing") the app and its nested `hive` are signed with that identity under the
    # hardened runtime, and Tauri notarizes and staples the app (App Store Connect API key); else
    # with Hive's self-signed certificate (the HIVE_CERTIFICATE* secrets), so macOS's grants survive
    # updates; else ad-hoc, with a warning. Each secret reaches only the steps that need it, and only
    # after every dependency is built (`--no-bundle`), so a build script that has exited never saw
    # them or the unlocked keychain; a process one left running could still reach that keychain.
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
    env:
      # A dSYM per release (D18.6): line tables in `hive.dSYM` and `hive-app.dSYM`, beside the
      # stripped binaries (`strip = true` runs after `dsymutil`), so crash reports can be read.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        # Pinned: a newer bun counts comment-only lines as uncovered.
        with:
          bun-version-file: .bun-version
      # "developer-id" with all six Apple secrets, else "self-signed" with all three of the
      # certificate, "adhoc" with none; a partial set fails.
      - id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          HIVE_CERTIFICATE: ${{ secrets.HIVE_CERTIFICATE }}
          HIVE_CERTIFICATE_PASSWORD: ${{ secrets.HIVE_CERTIFICATE_PASSWORD }}
          HIVE_CERTIFICATE_SHA1: ${{ secrets.HIVE_CERTIFICATE_SHA1 }}
        # On its own line: a partial set must stop here, which a pipe's exit status would hide.
        run: |
          mode=$(scripts/macos-bundle.sh signing-mode)
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"
      # The release does not stop: it stays as it was, and says what that costs.
      - if: steps.signing.outputs.mode == 'adhoc'
        run: echo "::warning title=Hive is signed ad-hoc::No signing certificate in the release environment, so every update loses what macOS allowed Hive (Screen Recording, Accessibility, folders). README, Signing with Hive's certificate."
      - run: |
          cargo build --release --locked -p hive
          mkdir -p src-tauri/resources
          cp target/release/hive src-tauri/resources/hive
      - run: bun install --frozen-lockfile
      # The frontend and the app binary, without signing anything.
      - run: bun tauri build --no-bundle --config src-tauri/tauri.release.macos.conf.json
      - if: steps.signing.outputs.mode == 'adhoc'
        run: |
          scripts/macos-bundle.sh sign-hive src-tauri/resources/hive
          bun tauri bundle --config src-tauri/tauri.release.macos.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The certificate in a keychain of this job only.
      - if: steps.signing.outputs.mode == 'developer-id' || steps.signing.outputs.mode == 'self-signed'
        env:
          SIGNING_CERTIFICATE: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_CERTIFICATE || secrets.HIVE_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.APPLE_CERTIFICATE_PASSWORD || secrets.HIVE_CERTIFICATE_PASSWORD }}
        run: scripts/macos-bundle.sh import-certificate "$RUNNER_TEMP/signing.keychain-db"
      # The API key in a file (Tauri reads a path).
      - if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
      # The nested `hive` with the app's identity (notarization needs every binary signed); Tauri
      # notarizes because the APPLE_API_* variables are set (the ad-hoc step above has none).
      - if: steps.signing.outputs.mode == 'developer-id'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8
          scripts/macos-bundle.sh sign-hive src-tauri/resources/hive
          bun tauri bundle --config src-tauri/tauri.release.macos.conf.json \
            --config "$(jq -cn --arg id "$APPLE_SIGNING_IDENTITY" '{bundle: {macOS: {signingIdentity: $id}}}')"
      # The nested `hive` and the app with the certificate, by its SHA-1. No APPLE_* variable is
      # set, so Tauri neither imports a certificate nor notarizes.
      - if: steps.signing.outputs.mode == 'self-signed'
        env:
          HIVE_CERTIFICATE_SHA1: ${{ secrets.HIVE_CERTIFICATE_SHA1 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          scripts/macos-bundle.sh sign-hive src-tauri/resources/hive
          bun tauri bundle --config src-tauri/tauri.release.macos.conf.json \
            --config "$(jq -cn --arg id "$HIVE_CERTIFICATE_SHA1" '{bundle: {macOS: {signingIdentity: $id}}}')"
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.keychain-db.p12" "$RUNNER_TEMP/api-key.p8"
      # codesign --verify --deep --strict, the nested `hive`'s signer, entitlements, Info.plist;
      # with the Developer ID also `spctl -a` and the stapled ticket; with the certificate also a
      # designated requirement that names it.
      - env:
          MODE: ${{ steps.signing.outputs.mode }}
          HIVE_CERTIFICATE_SHA1: ${{ secrets.HIVE_CERTIFICATE_SHA1 }}
        run: |
          case $MODE in
            developer-id) identity=(--developer-id) ;;
            self-signed) identity=(--self-signed "$HIVE_CERTIFICATE_SHA1") ;;
            adhoc) identity=() ;;
            *) echo "unknown signing mode: '$MODE'" >&2; exit 1 ;;
          esac
          scripts/macos-bundle.sh check target/release/bundle/macos/Hive.app "${identity[@]}"
      # Each dSYM's UUID is the shipped binary's (`dwarfdump --uuid`).
      - run: scripts/macos-bundle.sh dsyms target/release/bundle/macos/Hive.app target/release
      # The asset names tauri-action gave the updater tarball (`Hive_aarch64.app.tar.gz`); the
      # dSYMs zipped beside them (cargo's `target/release/*.dSYM` are links into `deps`).
      - run: |
          mkdir out dsym
          cp -RL target/release/hive-app.dSYM target/release/hive.dSYM dsym/
          (cd dsym && zip -qr ../out/Hive_aarch64.dSYM.zip .)
          cp target/release/bundle/dmg/*.dmg out/
          cp target/release/bundle/macos/Hive.app.tar.gz out/Hive_aarch64.app.tar.gz
          cp target/release/bundle/macos/Hive.app.tar.gz.sig out/Hive_aarch64.app.tar.gz.sig
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-macos
          path: out/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and every tag: the notes compare with the previous tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true
      # The commits since the previous tag and the first-launch link (26.6); the first self-signed
      # release also says to allow Hive once more (25.5). On its own line: a failure must stop here,
      # which a pipe's exit status would hide.
      - name: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.macos.outputs.signing }}
          # As `latest.json` below: a dry run names the release after the version.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases" --jq '.[].body // empty' > earlier-notes
          scripts/release-notes.sh "${TAG:-v$(jq -r .version src-tauri/tauri.conf.json)}" "$MODE" < earlier-notes > notes.md
          cat notes.md
      - name: latest.json
        env:
          # A dry run names the release after the version it would publish.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag=${TAG:-v$version}
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match version $version" >&2; exit 1; }
          base=https://github.com/${{ github.repository }}/releases/download/$tag
          exe=$(cd out && ls *-setup.exe)
          # Separate assignments: `set -e` stops on a missing signature.
          win_sig=$(cat "out/$exe.sig")
          mac_sig=$(cat out/Hive_aarch64.app.tar.gz.sig)
          notes=$(cat notes.md)
          jq -n --arg version "$version" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --arg win_sig "$win_sig" --arg win_url "$base/$exe" \
            --arg mac_sig "$mac_sig" --arg mac_url "$base/Hive_aarch64.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "windows-x86_64-nsis": {signature: $win_sig, url: $win_url},
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
                "darwin-aarch64-app": {signature: $mac_sig, url: $mac_url}}}' > out/latest.json
          cat out/latest.json
          ls -l out
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # `gh release create` uploads every file before it publishes the release, so the
      # updater never sees a `latest.json` whose files are missing.
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "Hive $TAG" --notes-file notes.md out/*
