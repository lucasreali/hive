# TEMPORARY (12 macOS flakes): runs the hive tests many times on macOS and prints what
# ended terminals. Removed before the task is reported.
name: stress

on:
  push:
    branches: ["task/12-macos-flakes"]

jobs:
  stress:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
    strategy:
      fail-fast: false
      matrix:
        mode: [cov, plain]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: brew install fish
      - name: stress
        run: |
          if [ "${{ matrix.mode }}" = cov ]; then run() { cargo llvm-cov -p hive --no-report; }; else run() { cargo test -p hive; }; fi
          run > /dev/null 2>&1 || true
          rm -f /tmp/hive-debug.log
          fails=0
          for i in $(seq 1 12); do
            if ! run > out-$i.txt 2>&1; then
              fails=$((fails+1))
              echo "=== run $i failed"
              grep -E "^test .* FAILED|panicked at|left:|right:" out-$i.txt | cut -c1-700
              grep -oE '\.tmp[A-Za-z0-9]{6}' out-$i.txt | sort -u >> failed-dirs.txt
            fi
          done
          echo "failed runs: $fails of 12"
      - if: always()
        name: signals
        run: |
          grep -c . /tmp/hive-debug.log || true
          echo "##### unexpected exits"
          grep -n -B1 "SNAPSHOT UNEXPECTED" /tmp/hive-debug.log | cut -c1-400 | head -60 || true
          for dir in $(sort -u failed-dirs.txt 2>/dev/null | head -6); do
            echo "===== $dir"
            grep -F "$dir/" /tmp/hive-debug.log | cut -c1-400 | head -150
            for pid in $(grep -F "$dir/" /tmp/hive-debug.log | grep -oE 'shell=[0-9]+' | cut -d= -f2 | sort -u); do
              echo "--- signals to $pid"
              grep -E "(pid|pgrp|session): $pid[,} ]" /tmp/hive-debug.log | cut -c1-400 | head -20
            done
          done
      - if: always()
        name: snapshots
        run: grep -A250 "SNAPSHOT UNEXPECTED" /tmp/hive-debug.log | head -1500 || true
