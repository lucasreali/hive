# TEMPORARY (12 macOS flakes): runs the hive tests many times on macOS, as the macos job
# does, and prints every failure and crash report. Removed before the task is reported.
name: stress

on:
  push:
    branches: ["task/12-macos-flakes"]

jobs:
  stress:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: brew install fish
      - name: stress
        run: |
          run() { cargo llvm-cov -p hive --no-report; }
          run > /dev/null 2>&1 || true
          fails=0
          for i in $(seq 1 25); do
            if ! run > out-$i.txt 2>&1; then
              fails=$((fails+1))
              echo "=== run $i failed"
              grep -E -A3 "^test .* FAILED|panicked at" out-$i.txt | cut -c1-900
            fi
          done
          echo "failed runs: $fails of 25"
      - if: always()
        name: crash reports
        run: |
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -4); do
            echo "################ $f"
            head -c 20000 "$f"; echo
          done
