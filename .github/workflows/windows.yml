# The only place the service's native Windows code runs (12.5): clippy and the tests of `hive`
# and `hive-protocol` on Windows, and the coverage and mutants of `crates/hive/src/windows*`
# (excluded from the Linux gates, see COVERAGE_EXCLUSIONS.md).
name: windows

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes the running checks (as ci.yml).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this push can change the service on Windows: the branch's diff since it left
  # `main` (merge base with origin/main, as ci.yml's `changes`); always on `main` and on a manual
  # run. A job skipped by its `if` still leaves the run green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.diff.outputs.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          service=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/windows\.yml$)' <<< "$files" ||
              service=false
          fi
          echo "service=$service" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # The protocol tests compare files byte for byte (fixture, message catalog): keep LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-mutants
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # TEMPORARY diagnostic (12.5 mutant timeouts): the known timeouts, with cargo test and
      # with nextest, a long timeout to see how long they take, and the processes every 15 s.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      - run: |
          (while true; do date -u +%T; powershell -NoProfile -Command "Get-CimInstance Win32_Process | Sort-Object CreationDate | Select-Object -Last 30 ProcessId,ParentProcessId,Name,CreationDate,CommandLine | Format-Table -AutoSize | Out-String -Width 400"; sleep 15; done) > procs.txt 2>&1 &
          re='(==.*names_in)|(!= with ==.*check_owner)|(sid_text.*xyzzy)|(path_shell)'
          date -u +%T; cargo mutants --no-config -p hive -f crates/hive/src/windows.rs --re "$re" -j 1 --timeout 400 -o cargo-test || true
          date -u +%T; cargo mutants --no-config -p hive -f crates/hive/src/windows.rs --re "$re" -j 1 --timeout 400 --test-tool nextest -o nextest || true
          date -u +%T
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-diagnostic
          path: |
            cargo-test/mutants.out
            nextest/mutants.out
            procs.txt
          retention-days: 3
