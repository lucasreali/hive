# The only place the service's native Windows code runs (12.5): clippy and the tests of `hive`
# and `hive-protocol` on Windows, and the coverage and mutants of `crates/hive/src/windows*`
# (excluded from the Linux gates, see COVERAGE_EXCLUSIONS.md).
name: windows

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes the running checks (as ci.yml).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this push can change the service on Windows: the branch's diff since it left
  # `main` (merge base with origin/main, as ci.yml's `changes`); always on `main` and on a manual
  # run. A job skipped by its `if` still leaves the run green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.diff.outputs.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          service=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/windows\.yml$)' <<< "$files" ||
              service=false
          fi
          echo "service=$service" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    # TEMPORARY diagnostic (12.5 mutant timeouts): three full runs for a rare timeout.
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # The protocol tests compare files byte for byte (fixture, message catalog): keep LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-mutants
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # TEMPORARY: the lib tests over and over, two at a time; a run past 75 s gets its
      # threads' stacks (cdb) and the processes printed.
      - run: |
          exe=$(cargo test -p hive --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind[0] == "lib") | .executable' | tr -d '\r')
          echo "exe: $exe"
          cdb=$(ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" 2>/dev/null || true)
          echo "cdb: $cdb"
          for i in $(seq 1 45); do
            for k in 1 2; do "$exe" > "out-$k.txt" 2>&1 & done
            for t in $(seq 1 75); do
              sleep 1
              [ -z "$(jobs -r)" ] && break
            done
            if [ "$t" = 75 ]; then
              echo "::group::HANG at run $i"
              grep -h "running for over\|test result" out-*.txt
              powershell -NoProfile -Command "Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-Table -AutoSize | Out-String -Width 400"
              for pid in $(powershell -NoProfile -Command "(Get-Process | Where-Object Path -eq '$(cygpath -w "$exe")').Id" | tr -d '\r'); do
                echo "--- stacks of $pid"
                [ -n "$cdb" ] && "$cdb" -pv -p "$pid" -y "$(cygpath -w "$(dirname "$exe")")" -c "~*k 40; qd" 2>&1 | grep -v "^\s*$" | head -n 600
              done
              echo "::endgroup::"
              taskkill //F //IM "$(basename "$exe")" || true
            fi
            wait
            echo "run $i: $(grep -h 'test result' out-*.txt | tr '\n' ' ')"
          done
      # What a timeout or a missed mutant's tests printed, and the slowest test runs, here
      # rather than only in the artifact.
      - if: always() && hashFiles('mutants.out/outcomes.json') != ''
        run: |
          jq -r '.outcomes[] | [.summary, (.phase_results[] | select(.phase == "Test")
            | .duration | floor), (.scenario | .Mutant?.name // .)] | @tsv' \
            mutants.out/outcomes.json | tr -d '\r' | sort -k2 -n -r | head -n 15
          for log in $(jq -r '.outcomes[] | select(.summary == "Timeout" or .summary == "MissedMutant")
            | .log_path' mutants.out/outcomes.json | tr -d '\r'); do
            echo "::group::$log"; cat "mutants.out/$log"; echo "::endgroup::"
          done
