# The only place the service's native Windows code runs (12.5): clippy and the tests of `hive`
# and `hive-protocol` on Windows, and the coverage and the diff's mutants of
# `crates/hive/src/windows*` (excluded from the Linux gates, see COVERAGE_EXCLUSIONS.md; every
# one of their mutants runs nightly, mutants-full.yml).
name: windows

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:

# The checks only read the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the running checks (as ci.yml).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this push can change the service on Windows: the branch's diff since it left
  # `main` (merge base with origin/main, as ci.yml's `changes`); always on `main` and on a manual
  # run. A job skipped by its `if` still leaves the run green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.diff.outputs.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          service=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/windows\.yml$)' <<< "$files" ||
              service=false
          fi
          echo "service=$service" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # The protocol tests compare files byte for byte (fixture, message catalog): keep LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p hive -p hive-protocol --all-targets --locked -- -D warnings
      # Runs `cargo test` of both crates instrumented; every Windows file needs all its lines.
      - run: cargo llvm-cov -p hive -p hive-protocol --locked --no-fail-fast --no-report
      - run: cargo llvm-cov report --show-missing-lines
      - run: |
          cargo llvm-cov report --json --summary-only --output-path cov.json
          jq -e '[.data[0].files[] | select(.filename | test("crates.hive.src.windows"))]
            | length > 0 and all(.summary.lines.percent == 100)' cov.json
      # The diff's mutants, as macos.yml: none when the branch left these files unchanged and
      # none on `main`; every mutant runs nightly (mutants-full.yml). `--no-config`:
      # `.cargo/mutants.toml` excludes these files for Linux, so its `[profile.mutants]` build
      # and nextest (fails fast) are passed here, and the same timeout: sized from the baseline,
      # at least 120 s (`--minimum-test-timeout`), the baseline itself never limited.
      - run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then echo "on main: nothing to test"; exit 0; fi
          git diff "$(git merge-base origin/main HEAD)" -- 'crates/hive/src/windows*.rs' > diff.patch
          if [ -s diff.patch ]; then
            cargo mutants --no-config --profile mutants --test-tool nextest -p hive -f 'crates/hive/src/windows*.rs' --in-diff diff.patch -j 2 --minimum-test-timeout 120
          else
            echo "crates/hive/src/windows*.rs: unchanged, no mutants"
          fi
      # What a timed-out or missed mutant's tests printed (libtest names a test running over
      # 60 s), and the slowest test runs, in this log; everything in the artifact.
      - if: always() && hashFiles('mutants.out/outcomes.json') != ''
        run: |
          jq -r '.outcomes[] | [.summary, (.phase_results[] | select(.phase == "Test")
            | .duration | floor), (.scenario | .Mutant?.name // .)] | @tsv' \
            mutants.out/outcomes.json | tr -d '\r' | sort -t $'\t' -k2 -n -r | head -n 10
          jq -r '.outcomes[] | select(.summary == "Timeout" or .summary == "MissedMutant")
            | .log_path' mutants.out/outcomes.json | tr -d '\r' | while read -r log; do
            echo "::group::$log"; tail -n 150 "mutants.out/$log"; echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-windows
          path: mutants.out
          retention-days: 7
