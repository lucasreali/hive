# The only place the service's native Windows code runs (12.5): clippy and the tests of `hive`
# and `hive-protocol` on Windows, and the coverage and mutants of `crates/hive/src/windows*`
# (excluded from the Linux gates, see COVERAGE_EXCLUSIONS.md).
name: windows

on:
  push:
    branches: [main, "task/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes the running checks (as ci.yml).
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this push can change the service on Windows: the branch's diff since it left
  # `main` (merge base with origin/main, as ci.yml's `changes`); always on `main` and on a manual
  # run. A job skipped by its `if` still leaves the run green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.diff.outputs.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          service=true
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            # Not piped into `grep -q`: its early exit would fail the pipeline (pipefail).
            files=$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)
            grep -qE '^(crates/|Cargo\.(toml|lock)$|\.github/workflows/windows\.yml$)' <<< "$files" ||
              service=false
          fi
          echo "service=$service" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # The protocol tests compare files byte for byte (fixture, message catalog): keep LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-mutants
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p hive -p hive-protocol --all-targets --locked -- -D warnings
      # Runs `cargo test` of both crates instrumented; every Windows file needs all its lines.
      - run: cargo llvm-cov -p hive -p hive-protocol --locked --no-fail-fast --no-report
      - run: cargo llvm-cov report --show-missing-lines
      - run: |
          cargo llvm-cov report --json --summary-only --output-path cov.json
          jq -e '[.data[0].files[] | select(.filename | test("crates.hive.src.windows"))]
            | length > 0 and all(.summary.lines.percent == 100)' cov.json
      # `--no-config`: `.cargo/mutants.toml` excludes these files for Linux (and runs nextest).
      - run: cargo mutants --no-config -p hive -f 'crates/hive/src/windows*.rs' -j 2 --timeout 120
      # What a timed-out or missed mutant's tests printed (libtest names a test running over
      # 60 s), and the slowest test runs, in this log; everything in the artifact.
      - if: always() && hashFiles('mutants.out/outcomes.json') != ''
        run: |
          jq -r '.outcomes[] | [.summary, (.phase_results[] | select(.phase == "Test")
            | .duration | floor), (.scenario | .Mutant?.name // .)] | @tsv' \
            mutants.out/outcomes.json | tr -d '\r' | sort -t $'\t' -k2 -n -r | head -n 10
          jq -r '.outcomes[] | select(.summary == "Timeout" or .summary == "MissedMutant")
            | .log_path' mutants.out/outcomes.json | tr -d '\r' | while read -r log; do
            echo "::group::$log"; tail -n 150 "mutants.out/$log"; echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-windows
          path: mutants.out
          retention-days: 7

  # TEMPORARY proof (12.5 mutant timeouts): the lib tests 90 times, two at a time, in three
  # jobs; a run past 75 s gets its threads' stacks (cdb) and fails the job.
  stress:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          exe=$(cargo test -p hive --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind[0] == "lib") | .executable' | tr -d '\r')
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          hangs=0
          for i in $(seq 1 45); do
            for k in 1 2; do "$exe" > "out-$k.txt" 2>&1 & done
            for t in $(seq 1 75); do
              sleep 1
              [ -z "$(jobs -r)" ] && break
            done
            if [ "$t" = 75 ]; then
              hangs=$((hangs + 1))
              echo "::group::HANG at run $i"
              grep -h "running for over\|test result" out-*.txt
              for pid in $(powershell -NoProfile -Command "(Get-Process | Where-Object Path -eq '$(cygpath -w "$exe")').Id" | tr -d '\r'); do
                "$cdb" -pv -p "$pid" -y "$(cygpath -w "$(dirname "$exe")")" -c "~*k 40; qd" 2>&1 | grep -E "Id: |!" | head -n 300
              done
              echo "::endgroup::"
              taskkill //F //IM "$(basename "$exe")" || true
            fi
            wait || true
            echo "run $i: $(grep -h 'test result' out-*.txt | tr '\n' ' ')"
          done
          echo "hangs: $hangs"
          [ "$hangs" = 0 ]
