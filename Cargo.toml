[workspace]
resolver = "3"
members = ["src-tauri", "crates/hive-protocol", "crates/hive"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
