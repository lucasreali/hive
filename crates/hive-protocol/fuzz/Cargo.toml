[package]
name = "hive-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12.1"
hive-protocol = { version = "0.1.0", path = ".." }
libfuzzer-sys = "0.4"
tokio-util = { version = "0.7.19", features = ["codec"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
