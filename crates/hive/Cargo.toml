[package]
name = "hive"
version = "0.7.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hive-protocol = { version = "0.1.0", path = "../hive-protocol" }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "hook_latency"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
libproc = "0.14.11"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "user", "process", "fs", "time"] }
pty-process = { version = "0.5.3", features = ["async"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Threading"] }
