[graph]
all-features = true

[advisories]
version = 2
# Unmaintained crates pulled in only by Tauri; no fix is available on our side.
# Approved by the human on 2026-09-23. Remove each entry once Tauri drops the crate.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time only, via gtk 0.18 (Tauri on Linux)" },
    { id = "RUSTSEC-2025-0075", reason = "unic-*: via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-*: via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-*: via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-*: via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-*: via tauri-utils -> urlpattern" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "ISC",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "MPL-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
