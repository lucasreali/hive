<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes hivePulse { 0% { transform: scale(1); opacity: .6 } 70% { transform: scale(2.3); opacity: 0 } 100% { transform: scale(2.3); opacity: 0 } }
</style>
</helmet>
<span title="{{ label }}" style="display:inline-flex;width:12px;height:12px;flex:none;align-items:center;justify-content:center">
<sc-if value="{{ isPerm }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.3 11.2 10.5H.8z" fill="#dec184" style="stroke:#dec184;stroke-width:1;stroke-linejoin:round"></path><rect x="5.35" y="4.2" width="1.3" height="3.3" rx=".6" fill="#282c33"></rect><circle cx="6" cy="8.9" r=".75" fill="#282c33"></circle></svg></sc-if>
<sc-if value="{{ isErr }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.2" fill="#d07277"></circle><path d="M4 4 8 8M8 4 4 8" fill="none" style="stroke:#282c33;stroke-width:1.5;stroke-linecap:round"></path></svg></sc-if>
<sc-if value="{{ isYou }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.4" fill="none" style="stroke:#e08a5a;stroke-width:1.6"></circle><circle cx="6" cy="6" r="1.7" fill="#e08a5a"></circle></svg></sc-if>
<sc-if value="{{ isWork }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12" style="overflow:visible"><circle cx="6" cy="6" r="3.1" fill="#74ade8" style="transform-box:fill-box;transform-origin:center;animation:hivePulse 2.4s ease-out infinite"></circle><circle cx="6" cy="6" r="3.1" fill="#74ade8"></circle></svg></sc-if>
<sc-if value="{{ isSub }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 3v3M6 6 2.8 9M6 6l3.2 3" fill="none" style="stroke:#b477cf;stroke-width:1.2"></path><circle cx="6" cy="2.6" r="2" fill="#b477cf"></circle><circle cx="2.6" cy="9.3" r="2" fill="#b477cf"></circle><circle cx="9.4" cy="9.3" r="2" fill="#b477cf"></circle></svg></sc-if>
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.2" fill="#a1c181"></circle><path d="M3.6 6.2 5.3 7.8 8.5 4.4" fill="none" style="stroke:#282c33;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"></path></svg></sc-if>
<sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="#878a98"></rect></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:40,&quot;height&quot;:40},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;perm&quot;,&quot;erro&quot;,&quot;voce&quot;,&quot;trab&quot;,&quot;sub&quot;,&quot;ocioso&quot;,&quot;fim&quot;],&quot;default&quot;:&quot;trab&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'trab';
    const L = { perm: 'aguardando permissão', erro: 'erro', voce: 'aguardando você', trab: 'trabalhando', sub: 'com subagentes', ocioso: 'ocioso', fim: 'encerrado' };
    return { label: L[s] || s, isPerm: s === 'perm', isErr: s === 'erro', isYou: s === 'voce', isWork: s === 'trab', isSub: s === 'sub', isIdle: s === 'ocioso', isEnd: s === 'fim' };
  }
}
</script>
</body>
</html>
