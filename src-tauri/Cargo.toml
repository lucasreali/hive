[package]
name = "hive-app"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hive-protocol = { version = "0.1.0", path = "../crates/hive-protocol" }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }


[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
